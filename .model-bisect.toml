# Repository-level configuration for Model Bisect GitHub Action / CLI
# Smoke test evaluation for GitHub Actions workflow
eval_command = "python -c \"import os; print('accuracy=0.80' if os.path.exists('model/accuracy.txt') else '0.95')\""
metric_name = "accuracy"
threshold = 0.90
direction = "higher"
valid_range = [0.0, 1.0]
timeout = 120.0
repeat_count = 1
fail_on_not_found = false
