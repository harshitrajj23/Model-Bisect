services:
  api:
    build: .
    command: uvicorn model_bisect.api:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MODEL_BISECT_DB_PATH=/data/model_bisect.db
      - MODEL_BISECT_TARGETS_FILE=/app/targets.toml
      - MODEL_BISECT_REPO_ROOT=/repos
      - GIT_CONFIG_COUNT=2
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/repos/demo_repo
      - GIT_CONFIG_KEY_1=safe.directory
      - GIT_CONFIG_VALUE_1=/repos/alternating_repo
    volumes:
      - db-data:/data
      - ./targets.toml:/app/targets.toml:ro
      - ./repos:/repos
    restart: unless-stopped

  worker:
    build: .
    command: python -m model_bisect.worker
    environment:
      - MODEL_BISECT_DB_PATH=/data/model_bisect.db
      - MODEL_BISECT_TARGETS_FILE=/app/targets.toml
      - MODEL_BISECT_REPO_ROOT=/repos
      - MODEL_BISECT_POLL_INTERVAL=1.0
      - GIT_CONFIG_COUNT=2
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/repos/demo_repo
      - GIT_CONFIG_KEY_1=safe.directory
      - GIT_CONFIG_VALUE_1=/repos/alternating_repo
    volumes:
      - db-data:/data
      - ./targets.toml:/app/targets.toml:ro
      - ./repos:/repos
    restart: unless-stopped
    depends_on:
      - api


volumes:
  db-data:
